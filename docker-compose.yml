version: "3.9"

# ── WeatherGPT Production Stack ───────────────────────────────────────────────
# Start everything: docker-compose up --build
# Stop everything:  docker-compose down
# View logs:        docker-compose logs -f
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: weathergpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weathergpt_dev_pwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache (optional, for shared cache across workers) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: weathergpt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8000
      DEMO_MODE: "False"
      DATABASE_URL: postgresql://weathergpt:${POSTGRES_PASSWORD:-weathergpt_dev_pwd}@postgres:5432/weathergpt
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:3000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-your_openrouter_api_key_here}
      OPENROUTER_MODEL: openrouter/auto
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_in_production_use_a_strong_random_key}
      JWT_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./backend:/app  # Hot-reload in dev; remove for production

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weathergpt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
