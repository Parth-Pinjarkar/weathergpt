name: WeatherGPT CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ─────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend — Python Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        working-directory: backend
        run: |
          # Stop if there are Python syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (max line length 120)
          flake8 app/ --count --exit-zero --max-line-length=120 --statistics

      - name: Run backend integration tests
        working-directory: backend
        env:
          DEMO_MODE: "True"
          DATABASE_URL: "sqlite:///./test_weathergpt.db"
          JWT_SECRET_KEY: "test_secret_key_for_ci_only"
          GEMINI_API_KEY: ""
        run: python tests/test_backend.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test_weathergpt.db
          if-no-files-found: ignore

  # ── Frontend Tests ────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend — TypeScript & ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build (production validation)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8000"
        run: npm run build

  # ── Security Audit ────────────────────────────────────────────────────────────
  security-audit:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: NPM security audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true   # Warn but don't fail on advisories

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python safety check (backend)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42974
        continue-on-error: true

  # ── Docker Build Validation ───────────────────────────────────────────────────
  docker-build:
    name: Docker — Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t weathergpt-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t weathergpt-frontend:ci ./frontend
